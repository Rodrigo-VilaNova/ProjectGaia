name: Run Tests, Build and Deploy ASP.Net Core app to Azure Web App

on:
  push:
    branches:
      - main  # Trigger this workflow when commits are pushed to the 'main' branch
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest  # Use Windows environment for the tests

    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest  # Use the SQL Server Docker image
        env:
          SA_PASSWORD: ${{ secrets.SA_PASSWORD }}  # Get the SQL Server password from GitHub Secrets
          ACCEPT_EULA: "Y"  # Accept the SQL Server license agreement
        ports:
          - 1433:1433  # Expose SQL Server port

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4  # Checkout the repository to the GitHub runner

      - name: Set up .NET
        uses: actions/setup-dotnet@v4  # Set up .NET SDK
        with:
          dotnet-version: 8.0.x  # Use the required .NET version

      - name: Restore dependencies
        run: dotnet restore  # Restore the project's dependencies

      - name: Build the project
        run: dotnet build  # Build the project

      - name: Run tests
        env:
          GITHUB_ACTIONS: true  # Explicitly set the GitHub Actions environment variable
          SA_PASSWORD: ${{ secrets.SA_PASSWORD }}
        run: dotnet test  # Run the tests
  
  build:
    runs-on: windows-latest
    needs: test
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build with dotnet
        run: dotnet build --configuration Release

      - name: dotnet publish
        run: dotnet publish -c Release -o "${{env.DOTNET_ROOT}}/app"

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/app

  deploy:
    runs-on: windows-latest
    needs: build
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'ProjectGaia'
          slot-name: 'Production'
          package: .
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_BB5575E5692B49F9A1EB64A62E1C6358 }}