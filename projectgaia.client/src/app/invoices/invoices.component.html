<body>
  <div class="page-container">
    <div class="navbar">
      <button (click)="goToDashboard()" class="btn dashboard-btn">Project Gaia</button>
      <p class="btn page-selected-btn">Invoices</p>
      <button (click)="goToEvents()" class="btn events-btn">Events</button>
      <button class="btn simulation-btn">Teste2</button>
      <div class="profile-circle" (click)="goToProfile()"></div>
    </div>

    <div class="invoices-container">
      <h2>Your Invoices</h2>
      <div class="button-group">
        <button (click)="toggleFilterOverlay()" class="btn filter-btn">Filter</button>
        <button (click)="goToAddInvoice()" class="btn add-invoice-btn">+ Add Invoice</button>
        <button (click)="deleteSelectedInvoices()" class="btn delete-btn" [disabled]="selectedInvoices.length === 0"> Delete Selected </button>
      </div>
      <div *ngIf="showFilterOverlay" class="filter-overlay">
        <div class="filter-box">
          <h3>Filter Invoices</h3>
          <label>ID Order:</label>
          <select [(ngModel)]="filters.idOrder">
            <option value="">None</option>
            <option value="asc">Ascending</option>
            <option value="desc">Descending</option>
          </select>

          <label>Price (€) Range:</label>
          <div class="range-container">
            <input type="number" [(ngModel)]="filters.priceMin" placeholder="Min" />
            <input type="number" [(ngModel)]="filters.priceMax" placeholder="Max" />
          </div>

          <label>Consumption (kWh) Range:</label>
          <div class="range-container">
            <input type="number" [(ngModel)]="filters.consumptionMin" placeholder="Min" />
            <input type="number" [(ngModel)]="filters.consumptionMax" placeholder="Max" />
          </div>

          <label>Emission Date:</label>
          <div class="range-container">
            <input type="date" [(ngModel)]="filters.emissionDateMin" />
            <input type="date" [(ngModel)]="filters.emissionDateMax" />
          </div>

          <label>Upload Date:</label>
          <div class="range-container">
            <input type="date" [(ngModel)]="filters.uploadDateMin" />
            <input type="date" [(ngModel)]="filters.uploadDateMax" />
          </div>

          <button (click)="applyFilters()" class="btn apply-filters-btn">Apply</button>
          <button (click)="resetFilters()" class="btn reset-filters-btn">Reset</button>
          <button (click)="toggleFilterOverlay()" class="btn close-filters-btn">Close</button>
        </div>
      </div>


      <table *ngIf="filteredInvoices.length > 0; else noInvoices" class="invoice-table">
        <thead>
          <tr>
            <th></th>
            <th>ID</th>
            <th>Price (€)</th>
            <th>Consumption (kWh)</th>
            <th>Emission Date</th>
            <th>Upload Date</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let invoice of filteredInvoices">
            <td><input type="checkbox" (change)="toggleInvoiceSelection(invoice.id, $event)" /></td>
            <td>{{ invoice.id }}</td>
            <td>{{ invoice.price }}€</td>
            <td>{{ invoice.consumption }}kWh</td>
            <td>{{ invoice.emissionDate | date }}</td>
            <td>{{ invoice.uploadDate | date }}</td>
          </tr>
        </tbody>
      </table>

      <ng-template #noInvoices>
        <p>No invoices available.</p>
      </ng-template>
    </div>
  </div>
</body>
