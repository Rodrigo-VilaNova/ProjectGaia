<body>
  <div class="page-container">
    <div class="navbar">
      <button (click)="goToDashboard()" class="btn dashboard-btn">Project Gaia</button>
      <p class="btn page-selected-btn">Invoices</p>
      <p>Teste2</p>
      <p>Teste3</p>
      <div class="profile-circle"></div>
    </div>

    <div class="invoices-container">
      <h2>Your Invoices</h2>

      <button (click)="goToAddInvoice()" class="btn add-invoice-btn">+ Add Invoice</button>
      <button (click)="deleteSelectedInvoices()" class="btn delete-btn" [disabled]="selectedInvoices.length === 0">
        Delete Selected
      </button>

      <table *ngIf="invoices.length > 0; else noInvoices" class="invoice-table">
        <thead>
          <tr>
            <th></th>
            <th>ID</th>
            <th>Price (€)</th>
            <th>Consumption (kWh)</th>
            <th>Emission Date</th>
            <th>Upload Date</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let invoice of invoices">
            <td>
              <input type="checkbox" (change)="toggleInvoiceSelection(invoice.id, $event)" />
            </td>
            <td>{{ invoice.id }}</td>
            <td>{{ invoice.price }}€</td>
            <td>{{ invoice.consumption }}kWh</td>
            <td>{{ invoice.emissionDate | date }}</td>
            <td>{{ invoice.uploadDate | date }}</td>
          </tr>
        </tbody>
      </table>

      <ng-template #noInvoices>
        <p>No invoices available.</p>
      </ng-template>
    </div>
  </div>
</body>
