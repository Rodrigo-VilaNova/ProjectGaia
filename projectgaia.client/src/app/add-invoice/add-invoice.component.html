<body>
  <div class="page-container">
    <div class="navbar">
      <button (click)="goToDashboard()" class="btn dashboard-btn">Project Gaia</button>
      <div class="profile-circle"></div>
    </div>

    <div class="form-container">
      <h2>Add New Invoice</h2>
      <form class="form-group" [formGroup]="invoiceForm" (ngSubmit)="submitInvoice()">
        <label for="price">Price (€):</label>
        <input type="number" id="price" formControlName="price" [(ngModel)]="invoice.price" required />

        <label for="consumption">Consumption (kWh):</label>
        <input type="number" id="consumption" formControlName="consumption" [(ngModel)]="invoice.consumption" required />

        <label for="emissionDate">Emission Date:</label>
        <input type="date" id="emissionDate" formControlName="emissionDate" [(ngModel)]="invoice.emissionDate" [max]="today" required />

        <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>

        <div class="button-container">
          <button (click)="submitInvoice()" [disabled]="isSubmitting" class="btn submit-btn">Add Invoice</button>
          <button (click)="goToInvoices()" class="btn cancel-btn">Cancel</button>
        </div>
      </form>

      <p *ngIf="successMessage" class="success-message">{{ successMessage }}</p>
    </div>
  </div>
</body>
