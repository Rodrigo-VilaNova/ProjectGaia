<body>
  <div class="page-container">
    <app-navbar></app-navbar>
    <div class="form-container">
      <h2>Add New Invoice</h2>
      <form class="form-group" [formGroup]="invoiceForm" (ngSubmit)="submitInvoice()">
        <label for="price">Price (€):</label>
        <input type="number" id="price" formControlName="price" [min]="0" required />
        <p class="error-message" *ngIf="invoiceForm.controls['price'].errors?.['min']">Price must be greater than 0.</p>

        <label for="consumption">Consumption (kWh):</label>
        <input type="number" id="consumption" formControlName="consumption" [min]="0" required />
        <p class="error-message" *ngIf="invoiceForm.controls['consumption'].errors?.['min']">Consumption must be greater than 0.</p>

        <label for="emissionDate">Emission Date:</label>
        <input type="date" id="emissionDate" formControlName="emissionDate" [max]="today" required />

        <p *ngIf="errorMessage" class="error-message">{{ errorMessage }}</p>

        <div class="button-container">
          <button (click)="submitInvoice()" [disabled]="isSubmitting" class="btn submit-btn">Add Invoice</button>
          <button (click)="goToInvoices()" class="btn cancel-btn">Cancel</button>
        </div>
      </form>

      <p *ngIf="successMessage" class="success-message">{{ successMessage }}</p>
    </div>
  </div>
</body>
