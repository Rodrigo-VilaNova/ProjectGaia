<body>
  <div class="page-container">
    <app-navbar></app-navbar>
    <div class="edit-invoice-container">
      <h2>Edit Invoice</h2>

      <form [formGroup]="invoiceForm" (ngSubmit)="submitEdit()">
        <label for="price">Price (€):</label>
        <input type="number" id="price" formControlName="price" required />
        <p class="error-message" *ngIf="invoiceForm.controls['price'].invalid && invoiceForm.controls['price'].touched">
          Price cannot be empty or contain only spaces.
        </p>

        <label for="consumption">Consumption (kWh):</label>
        <input type="number" id="consumption" formControlName="consumption" required />
        <p class="error-message" *ngIf="invoiceForm.controls['consumption'].invalid && invoiceForm.controls['consumption'].touched">
          Consumption cannot be empty or contain only spaces.
        </p>

        <label for="emissionDate">Emission Date:</label>
        <input type="date" id="emissionDate" formControlName="emissionDate" [max]="today" required />

        <button type="submit" [disabled]="invoiceForm.invalid" class="btn submit-btn">Save</button>
        <button type="button" class="btn cancel-btn" (click)="cancelEdit()">Cancel</button>
      </form>

      <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
      <p *ngIf="successMessage" class="success">{{ successMessage }}</p>
    </div>
  </div>
</body>
