<body>
  <div class="page-container">
    <div class="navbar">
      <button (click)="goToDashboard()" class="btn dashboard-btn">Project Gaia</button>
      <div class="profile-circle" (click)="goToProfile()"></div>
    </div>

    <div class="edit-invoice-container">
      <h2>Edit Invoice</h2>

      <form [formGroup]="invoiceForm" (ngSubmit)="submitEdit()">
        <label for="price">Price (€):</label>
        <input type="number" id="price" formControlName="price" required />

        <label for="consumption">Consumption (kWh):</label>
        <input type="number" id="consumption" formControlName="consumption" required />

        <label for="emissionDate">Emission Date:</label>
        <input type="date" id="emissionDate" formControlName="emissionDate" [max]="today" required />

        <button type="submit" class="btn submit-btn">Save</button>
        <button type="button" class="btn cancel-btn" (click)="cancelEdit()">Cancel</button>
      </form>

      <p *ngIf="errorMessage" class="error">{{ errorMessage }}</p>
      <p *ngIf="successMessage" class="success">{{ successMessage }}</p>
    </div>
  </div>
</body>
